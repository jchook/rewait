name: Release

# Publishes to npm whenever a v* tag is pushed. Authenticates with npm via
# OIDC trusted publishing (no NPM_TOKEN), so this workflow file name and the
# repository must match the trusted publisher registered on npmjs.com.
#
#   v2.0.0          -> npm dist-tag "latest"
#   v2.1.0-alpha.0  -> npm dist-tag "next" (any prerelease)

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # mint the OIDC token for npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Resolve version and dist-tag from the git tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg_version"
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next; prerelease=true ;;
            *)   dist_tag=latest; prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun spec/index.spec.ts

      - name: Publish to npm
        run: npm publish --provenance --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details."
          $([ "${{ steps.meta.outputs.prerelease }}" = "true" ] && echo --prerelease)
