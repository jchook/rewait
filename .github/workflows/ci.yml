name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Coverage runs the specs directly with node, which needs native
      # TypeScript type stripping (Node >= 23.6)
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun spec/index.spec.ts

      - name: Coverage
        run: >
          ./node_modules/.bin/c8 --100 -n src
          --reporter=text --reporter=lcov
          node spec/index.spec.ts

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
